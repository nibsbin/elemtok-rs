name: Release

# Publishes to crates.io when a GitHub Release is published.
#
# One-time setup: create a crates.io API token with publish rights for this
# crate and store it as the repository secret CARGO_REGISTRY_TOKEN.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: dtolnay/rust-toolchain@stable

      # Refuse to publish if the release tag and Cargo.toml version disagree.
      - name: Verify tag matches Cargo.toml version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION="v$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$PKG_VERSION" != "$REF_NAME" ]; then
            echo "Release tag '$REF_NAME' does not match Cargo.toml version '$PKG_VERSION'" >&2
            exit 1
          fi

      - run: cargo test

      - run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
